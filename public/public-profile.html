<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Profile – SafePass ID</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/public-profile.css">
</head>
<body>
  <div class="container">
    <img id="profile-photo" alt="Profile Photo">

    <h1 id="first-name">First Name</h1>
    <p id="country">Country of Residence</p>

    <h2>Medical Alerts</h2>
    <div id="medical-alerts"></div>

    <h2>Emergency Contact</h2>
    <a id="emergency-contact" class="call-btn">Call Contact</a>

    <p class="disclaimer">
      This profile is for emergency assistance only.  
      Information shown here is limited to what the owner has chosen to share.  
    </p>
  

    <footer>
        &copy; 2024 SafePass ID. All rights reserved.  
        <p class="footer-note">You are safe. You are seen. You are not alone.</p>
      </footer>
  </div>
  <script src="js/public-profile.js"></script>
</body>
</html>
