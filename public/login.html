<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Login to your SafePass ID account to manage your emergency information.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.jpeg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Login – SafePass ID</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logo.jpeg" alt="SafePass ID Logo" class="logo">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to access your SafePass ID dashboard</p>
      </div>

      <div id="notification" class="notification notification-hidden"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="loginIdentifier">Email or Phone Number</label>
          <input 
            type="text" 
            id="loginIdentifier" 
            placeholder="your.email@example.com or +27712345678" 
            required
            autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password">
        </div>

        <!-- reCAPTCHA TEMPORARILY DISABLED - HTML div commented out -->
        <!-- reCAPTCHA Widget (loaded dynamically in production only) -->
        <!-- <div class="recaptcha-container">
          <div id="recaptcha-placeholder" class="g-recaptcha" data-sitekey="6Lfhv2gsAAAAABru1o_M73gIsf1btNyWb2DmN96S" data-callback="onRecaptchaSuccess"></div>
        </div> -->

        <button type="submit" class="btn-submit">Access SafePass ID</button>
      </form>

      <div class="auth-footer">
        <p class="forgot-password-prompt">
          <a href="/forgot-password" class="link-primary">Forgot your password?</a>
        </p>
        
        <p class="signup-prompt">
          Don't have an account? 
          <a href="/signup" class="link-primary">Create one here</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <p>&copy; 2026 SafePass ID. All rights reserved.</p>
    <p class="footer-note">💜 You are safe. You are seen. You are not alone.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
