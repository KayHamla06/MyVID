<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SafePass ID</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container">
    <img src="assets/logo.jpeg" alt="SafePass ID Logo" class="logo">
    <h1>Welcome Back</h1>
    
    <p class="intro-text">
      Log in to access your SafePass ID dashboard.  
    </p>

    <form id="login-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Access SafePass ID</button>
    </form>

    <p class="help-text">
      Don’t have an account? <a class="create-account" href="/signup">Create one here</a>.
    </p>
  

    <footer>
      &copy; 2024 SafePass ID. All rights reserved.  
      <p class="footer-note">You are safe. You are seen. You are not alone.</p>
    </footer>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
