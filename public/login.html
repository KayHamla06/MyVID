<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SafePass ID</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logo.jpeg" alt="SafePass ID Logo" class="logo">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to access your SafePass ID dashboard</p>
      </div>

      <div id="notification" class="notification" style="display: none;"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="your.email@example.com" 
            required
            autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">Access SafePass ID</button>
      </form>

      <div class="auth-footer">
        <p class="signup-prompt">
          Don't have an account? 
          <a href="/signup" class="link-primary">Create one here</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <p>&copy; 2024 SafePass ID. All rights reserved.</p>
    <p class="footer-note">💜 You are safe. You are seen. You are not alone.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
